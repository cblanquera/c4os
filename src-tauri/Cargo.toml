[package]
name = "c4os"
version = "0.1.0"
description = "C4OS local macOS development application"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "c4os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
notify = { version = "=8.2.0", default-features = true }
rusqlite = { version = "=0.40.1", default-features = false, features = ["backup", "bundled"] }
rusqlite_migration = "=2.6.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
tauri = { version = "=2.11.5", features = [] }
tempfile = "=3.27.0"
thiserror = "=2.0.18"
toml = "=1.1.3"
tracing = "=0.1.44"
ts-rs = { version = "=12.0.1", features = ["serde-compat", "uuid-impl"] }
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
