[package]
name = "c4os"
version = "0.1.0"
description = "C4OS local macOS development application"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "c4os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
argon2 = "=0.5.3"
base64 = "=0.22.1"
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
ed25519-dalek = { version = "=3.0.0", default-features = false }
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
getrandom = "=0.3.4"
notify = { version = "=8.2.0", default-features = true }
portable-pty = "=0.9.0"
rusqlite = { version = "=0.40.1", default-features = false, features = ["backup", "bundled"] }
rusqlite_migration = "=2.6.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
semver = "=1.0.28"
sha2 = "=0.11.0"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = { version = "=2.7.2", default-features = false }
tempfile = "=3.27.0"
thiserror = "=2.0.18"
toml = "=1.1.3"
tracing = "=0.1.44"
ts-rs = { version = "=12.0.1", features = ["serde-compat", "uuid-impl"] }
url = "=2.5.8"
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
walkdir = "=2.5.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zeroize = "=1.9.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSDate", "NSError", "NSGeometry", "NSObject", "NSString", "NSURL", "NSURLRequest", "NSURLResponse", "NSUUID"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKBackForwardList", "WKBackForwardListItem", "WKContentWorld", "WKFrameInfo", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKNavigationResponse", "WKSecurityOrigin", "WKUIDelegate", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataRecord", "WKWebsiteDataStore", "WKWindowFeatures"] }
security-framework = { version = "=3.7.0", default-features = false, features = ["OSX_10_14"] }
