[package]
name = "c4os"
version = "0.1.0"
description = "C4OS local macOS development application"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "c4os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tauri = { version = "=2.11.5", features = [] }
thiserror = "=2.0.18"
tracing = "=0.1.44"
ts-rs = { version = "=12.0.1", features = ["serde-compat", "uuid-impl"] }
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
