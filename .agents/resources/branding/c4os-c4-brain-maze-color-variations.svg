<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1140" role="img" aria-labelledby="title description">
  <title id="title">C4OS C4 brain maze color variations</title>
  <desc id="description">Six rounded-square color applications using True Blue and Royal Purple while preserving the selected C4 brain maze geometry.</desc>
  <defs>
    <g id="brain-maze-mark" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M49 15H41C34 15 29 20 29 28H25C18 28 14 34 15 41C12 46 12 54 15 59C18 64 22 66 28 66C28 74 34 80 43 80H49" />
      <path d="M49 15V39H34V51H49V88" />
      <path d="M61 15H69C76 15 81 20 81 28H84C90 28 94 34 93 41C95 46 95 54 93 59C90 64 86 66 81 66C81 74 75 80 68 80" />
      <path d="M80 34L59 55H88" />
      <path d="M80 43V61" />
      <path d="M62 59V88" />
    </g>

    <clipPath id="rounded-field">
      <rect width="100" height="100" rx="22" />
    </clipPath>

    <linearGradient id="blue-purple-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0067FF" />
      <stop offset="1" stop-color="#6D3DF5" />
    </linearGradient>

    <symbol id="true-blue-field" viewBox="0 0 100 100">
      <rect width="100" height="100" rx="22" fill="#0067FF" />
      <g transform="translate(7 8) scale(.86)" color="#F7F5F0">
        <use href="#brain-maze-mark" />
      </g>
    </symbol>

    <symbol id="royal-purple-field" viewBox="0 0 100 100">
      <rect width="100" height="100" rx="22" fill="#6D3DF5" />
      <g transform="translate(7 8) scale(.86)" color="#F7F5F0">
        <use href="#brain-maze-mark" />
      </g>
    </symbol>

    <symbol id="split-field" viewBox="0 0 100 100">
      <g clip-path="url(#rounded-field)">
        <rect width="50" height="100" fill="#0067FF" />
        <rect x="50" width="50" height="100" fill="#6D3DF5" />
      </g>
      <g transform="translate(7 8) scale(.86)" color="#F7F5F0">
        <use href="#brain-maze-mark" />
      </g>
    </symbol>

    <symbol id="gradient-field" viewBox="0 0 100 100">
      <rect width="100" height="100" rx="22" fill="url(#blue-purple-gradient)" />
      <g transform="translate(7 8) scale(.86)" color="#F7F5F0">
        <use href="#brain-maze-mark" />
      </g>
    </symbol>

    <symbol id="pale-blue-field" viewBox="0 0 100 100">
      <rect x=".75" y=".75" width="98.5" height="98.5" rx="21.25" fill="#EAF2FF" stroke="#C3D8FF" stroke-width="1.5" />
      <g transform="translate(7 8) scale(.86)" color="#0067FF">
        <use href="#brain-maze-mark" />
      </g>
    </symbol>

    <symbol id="pale-purple-field" viewBox="0 0 100 100">
      <rect x=".75" y=".75" width="98.5" height="98.5" rx="21.25" fill="#F0EBFF" stroke="#D8CAFF" stroke-width="1.5" />
      <g transform="translate(7 8) scale(.86)" color="#6D3DF5">
        <use href="#brain-maze-mark" />
      </g>
    </symbol>

    <style>
      .board-title { fill: #171922; font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -.7px; }
      .board-subtitle { fill: #666A78; font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .variant-name { fill: #171922; font: 650 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .variant-token { fill: #747887; font: 500 14px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
      .size-note { fill: #9296A4; font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1536" height="1140" fill="#F3F4F8" />
  <text class="board-title" x="100" y="67">C4 brain maze · color exploration</text>
  <text class="board-subtitle" x="100" y="101">Fixed logo geometry · 22% rounded field · True Blue #0067FF · Royal Purple #6D3DF5</text>

  <g aria-label="True Blue Field">
    <use href="#true-blue-field" x="100" y="150" width="320" height="320" />
    <text class="variant-name" x="260" y="510">True Blue Field</text>
    <text class="variant-token" x="260" y="535">#0067FF · #F7F5F0</text>
    <use href="#true-blue-field" x="190" y="553" width="64" height="64" />
    <use href="#true-blue-field" x="270" y="569" width="32" height="32" />
    <use href="#true-blue-field" x="318" y="577" width="16" height="16" />
  </g>

  <g aria-label="Royal Purple Field">
    <use href="#royal-purple-field" x="608" y="150" width="320" height="320" />
    <text class="variant-name" x="768" y="510">Royal Purple Field</text>
    <text class="variant-token" x="768" y="535">#6D3DF5 · #F7F5F0</text>
    <use href="#royal-purple-field" x="698" y="553" width="64" height="64" />
    <use href="#royal-purple-field" x="778" y="569" width="32" height="32" />
    <use href="#royal-purple-field" x="826" y="577" width="16" height="16" />
  </g>

  <g aria-label="Split Field">
    <use href="#split-field" x="1116" y="150" width="320" height="320" />
    <text class="variant-name" x="1276" y="510">Split Field</text>
    <text class="variant-token" x="1276" y="535">#0067FF | #6D3DF5</text>
    <use href="#split-field" x="1206" y="553" width="64" height="64" />
    <use href="#split-field" x="1286" y="569" width="32" height="32" />
    <use href="#split-field" x="1334" y="577" width="16" height="16" />
  </g>

  <g aria-label="Diagonal Blend Field">
    <use href="#gradient-field" x="100" y="650" width="320" height="320" />
    <text class="variant-name" x="260" y="1010">Diagonal Blend</text>
    <text class="variant-token" x="260" y="1035">#0067FF → #6D3DF5</text>
    <use href="#gradient-field" x="190" y="1053" width="64" height="64" />
    <use href="#gradient-field" x="270" y="1069" width="32" height="32" />
    <use href="#gradient-field" x="318" y="1077" width="16" height="16" />
  </g>

  <g aria-label="Pale Blue Field">
    <use href="#pale-blue-field" x="608" y="650" width="320" height="320" />
    <text class="variant-name" x="768" y="1010">Pale Blue Field</text>
    <text class="variant-token" x="768" y="1035">#EAF2FF · #0067FF</text>
    <use href="#pale-blue-field" x="698" y="1053" width="64" height="64" />
    <use href="#pale-blue-field" x="778" y="1069" width="32" height="32" />
    <use href="#pale-blue-field" x="826" y="1077" width="16" height="16" />
  </g>

  <g aria-label="Pale Purple Field">
    <use href="#pale-purple-field" x="1116" y="650" width="320" height="320" />
    <text class="variant-name" x="1276" y="1010">Pale Purple Field</text>
    <text class="variant-token" x="1276" y="1035">#F0EBFF · #6D3DF5</text>
    <use href="#pale-purple-field" x="1206" y="1053" width="64" height="64" />
    <use href="#pale-purple-field" x="1286" y="1069" width="32" height="32" />
    <use href="#pale-purple-field" x="1334" y="1077" width="16" height="16" />
  </g>
</svg>
